<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#0e0e0d;color:#f2f0ea;font-family:Archivo,sans-serif}
.chequer{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,#FFD400 0 28px,transparent 28px 56px)}
.lane{position:absolute;left:0;right:0;bottom:0;height:10px;background:#FFD400}
/* X puts the profile photo over the bottom-left, so the copy sits right of center. */
.copy{position:absolute;left:520px;top:72px;right:80px}
h1{margin:0;font:900 80px/0.92 'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:.005em}
h1 span{color:#FFD400}
p{margin:20px 0 0;font:500 24px/1.35 Archivo,sans-serif;color:#a19e96;max-width:820px}
.tags{position:absolute;left:520px;bottom:44px;display:flex;gap:12px;font:500 17px 'JetBrains Mono',monospace;color:#f2f0ea}
.tags span{border:1px solid #3a3935;border-radius:4px;padding:8px 12px}
.tags b{color:#FFD400;font-weight:500}
.board{position:absolute;left:64px;top:70px;width:360px;padding:22px 24px;border:1px solid #3a3935;border-radius:12px;background:#000}
.board small{font:800 18px 'Big Shoulders Display';letter-spacing:.06em;color:#a19e96;text-transform:uppercase}
.board div{font:900 92px/0.85 'Big Shoulders Display';color:#FFD400;margin-top:10px}
.board em{display:block;font:800 18px 'Big Shoulders Display';font-style:normal;text-transform:uppercase;margin-top:8px}
.cells{display:flex;gap:5px;margin-top:14px}.cells i{flex:1;height:10px;border-radius:2px;background:#2e2d2a}.cells i.on{background:#FFD400}
</style></head><body>
<div class="chequer"></div>
<div class="board"><small>P1 · Agent</small><div>$4.03</div><em>Fuel on Tempo · limit $5 a day</em><div class="cells"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></div>
<div class="copy"><h1>Refuel your agents from any chain. <span>Keep them on a leash.</span></h1>
<p>Fuel and spending limits for AI agents that pay per call on Tempo.</p></div>
<div class="tags"><span><b>●</b> built on Tempo</span><span><b>●</b> routed by LI.FI</span><span>fuel.pitstopgas.workers.dev</span></div>
<div class="lane"></div>
</body></html>
