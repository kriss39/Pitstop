<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pitstop</title>
    <meta name="description" content="Fuel AI agents on Tempo from any chain in seconds, and keep them on a daily limit the chain enforces." />
    <meta name="theme-color" content="#0E0E0D" />
    <script>
      // Apply the saved light/dark choice before the first paint, so the page doesn't flash.
      try {
        const t = localStorage.getItem('pitstop.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pitstop" />
    <meta property="og:title" content="Pitstop · Refuel your AI agents from any chain" />
    <meta property="og:description" content="Fuel AI agents on Tempo from any chain in seconds, and keep them on a daily limit the chain enforces." />
    <meta property="og:url" content="https://fuel.pitstopgas.workers.dev" />
    <meta property="og:image" content="https://fuel.pitstopgas.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pitstop_agents" />
    <meta name="twitter:image" content="https://fuel.pitstopgas.workers.dev/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
