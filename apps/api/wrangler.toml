name = "fuel"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# No per-version preview URLs; only the main workers.dev URL is public.
preview_urls = false

# The web app (apps/web/dist) is served from the same Worker, so /lifi and /api are same-origin.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /assets/* goes through the Worker too, so a missing build file is a 404 rather than the app's HTML.
run_worker_first = ["/api/*", "/lifi/*", "/assets/*"]

# Agent registry (`wrangler d1 create pitstop`).
[[d1_databases]]
binding = "DB"
database_name = "pitstop"
database_id = "30973102-b7b9-490f-9ad6-6fe3f7021007"
migrations_dir = "migrations"

# Balance and limit watcher for Telegram alerts (every minute).
[triggers]
crons = ["* * * * *"]
